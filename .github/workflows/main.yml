name: main

on:
  workflow_dispatch:
  push:
    branches:
      - master
    tags:
      - "**"
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Build the exact head that the bundle updater will commit onto.
          ref: ${{ github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: ".tool-versions"
          package-manager-cache: false

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test

      - name: Test bundle automation
        run: node --test .github/scripts/dependabot-bundle.test.cjs

      - name: Format
        run: npm run fmtcheck

      - name: Actionlint
        shell: bash
        run: |
          set -euo pipefail

          version="1.7.12"
          archive="actionlint_${version}_linux_amd64.tar.gz"
          expected_sha="8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
          tmpdir="$(mktemp -d)"

          trap 'rm -rf "${tmpdir}"' EXIT
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${version}/${archive}" \
            -o "${tmpdir}/${archive}"
          printf '%s  %s\n' "${expected_sha}" "${tmpdir}/${archive}" | sha256sum -c -
          tar -xzf "${tmpdir}/${archive}" -C "${tmpdir}" actionlint
          "${tmpdir}/actionlint" -color=false

      - name: Upload Dependabot bundle
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.user.login == 'dependabot[bot]' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          startsWith(github.head_ref, 'dependabot/npm_and_yarn/')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependabot-bundle-${{ github.event.pull_request.head.sha }}
          path: dist/index.js
          if-no-files-found: error
          retention-days: 1
          overwrite: true

      - name: Check generated files
        run: |
          git diff --exit-code --stat -- . ':!node_modules' \
          || (echo "##[error] found changed files after build. please 'npm run build && npm run fmt'" \
                  "and check in all changes" \
              && exit 1)
  integration:
    needs: build
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: ".tool-versions"
          package-manager-cache: false

      - name: Diffset
        id: diffset
        uses: ./ # Uses an action in the root directory
        env:
          INPUT_MD_FILES: "*.md"
          INPUT_NO_MATCH_FILES: "**/*.definitely-missing"

      - name: Validate Diffset outputs
        env:
          DIFFSET_FILES_JSON: ${{ steps.diffset.outputs.files_json }}
          DIFFSET_OUTPUTS: ${{ toJSON(steps.diffset.outputs) }}
        shell: bash
        run: |
          set -euo pipefail

          jq -e '
            type == "array"
            and all(.[]; type == "string")
            and length == (unique | length)
          ' <<< "${DIFFSET_FILES_JSON}" >/dev/null

          md_files_json="$(jq -r '.md_files_json // "[]"' <<< "${DIFFSET_OUTPUTS}")"
          jq -e --argjson base "${DIFFSET_FILES_JSON}" '
            type == "array"
            and all(.[]; type == "string")
            and length == (unique | length)
            and all(.[];
              . as $file
              | (($base | index($file)) != null)
                and ($file | test("^[^/]+\\.md$"))
            )
          ' <<< "${md_files_json}" >/dev/null

          jq -e '
            .no_match_files == null
            and .no_match_files_json == null
          ' <<< "${DIFFSET_OUTPUTS}" >/dev/null

          while IFS= read -r encoded_file; do
            file="$(base64 --decode <<< "${encoded_file}")"
            if [ ! -e "${file}" ]; then
              echo "reported path does not exist after checkout: ${file}" >&2
              exit 1
            fi
          done < <(jq -r '.[] | @base64' <<< "${DIFFSET_FILES_JSON}")
